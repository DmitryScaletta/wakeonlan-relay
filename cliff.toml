[changelog]
# https://github.com/orhun/git-cliff/blob/main/examples/cocogitto.toml
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]\
            ($REPO/compare/{{ previous.version }}..{{ version }}) - \
            {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        - ([{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }})) \
            **({{commit.scope}})**{% if commit.breaking %} [**breaking**]{% endif %} \
            {{ commit.message }}
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits %}
        {%- if commit.scope -%}
        {% else -%}
            - ([{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }})) \
                {% if commit.breaking %} [**breaking**]{% endif %}\
                {{ commit.message }}
        {% endif -%}
    {% endfor -%}
{% endfor %}
{% if previous.version %}\
    **Full Changelog**: $REPO/compare/{{ previous.version }}..{{ version }}
{% endif %}\n
"""
postprocessors = [
    { pattern = '\$REPO', replace = "https://github.com/DmitryScaletta/wakeonlan-relay" }
]

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
]
